root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  bin = "./tmp/server"
  delay = 1000
  exclude_dir = ["tmp", "vendor"]
  include_ext = ["go", "env"]
  exclude_regex = []
  stop_on_error = false
  pre_cmd = ["swag init -g cmd/server/main.go -o docs"]

[log]
  time = true

[misc]
  clean_on_exit = true
