services:
  api:
    image: ghcr.io/samaita/address-quality:${API_IMAGE_TAG}
    container_name: address-quality-api
    restart: unless-stopped
    pull_policy: always
    env_file:
      - /etc/address-quality/.env.prod
    volumes:
      - /etc/address-quality/db:/data/db
    ports:
      - "7300:7300"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7300/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: "1.0"

  frontend:
    image: ghcr.io/samaita/address-quality-frontend:${FE_IMAGE_TAG}
    container_name: address-quality-frontend
    restart: unless-stopped
    pull_policy: always
    env_file:
      - /etc/address-quality/frontend.env
    ports:
      - "80:80"
    depends_on:
      - api
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: "0.5"
